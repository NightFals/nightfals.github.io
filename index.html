<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Bar with Hamburger Menu -->
    <div class="top-bar">
        <div class="hamburger" onclick="toggleMenu()">&#9776;</div>

        <!-- Navigation Buttons -->
        <div class="nav-buttons">
            <button onclick="showSection('daily')" class="active">Daily</button>
            <button onclick="showSection('weekly')">Weekly</button>
            <button onclick="showSection('monthly')">Monthly</button>
            <button onclick="showSection('projects')">Projects</button>
        </div>
    </div>

    <!-- Side Menu Dropdown -->
    <div class="side-menu" id="sideMenu">
        <a href="#">Home</a>
        <a href="#">Settings</a>
        <a href="#">About</a>
    </div>

    <!-- Main Content Area -->
    <div class="content">
        <div id="daily" class="section">Your daily tasks go here.</div>
        <div id="weekly" class="section" style="display:none;">Your weekly tasks go here.</div>
        <div id="monthly" class="section" style="display:none;">Your monthly tasks go here.</div>
        <div id="projects" class="section" style="display:none;">Your projects go here.</div>
    </div>

    <script src="index.js"></script>
</body>
</html>
